<svg xmlns="http://www.w3.org/2000/svg" width="480" height="126" viewBox="0 0 480 126" role="img" aria-labelledby="title desc">
<title id="title">Hi, I&#x27;m Chain — computer science student</title><desc id="desc">C++ in class, Python in projects and self-directed learning.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:5 8;animation:flow 2.4s linear infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.delayed{animation-delay:1.8s}
.cursor{animation:cursor 1.2s steps(1) infinite}
.page{animation:page 5s ease-in-out infinite}
.route{animation:route 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes page{0%,100%{transform:translateY(0)}45%,65%{transform:translateY(-5px)}}
@keyframes route{0%,100%{stroke-dashoffset:24}50%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.cursor,.page,.route{animation:none}}
</style>
<rect x="1" y="1" width="478" height="124" rx="12" fill="#171b20" stroke="#38434a" class=""/><text x="20" y="43" font-size="34" fill="#eff1e9" font-weight="700" class="" letter-spacing="-1">Hi, I&#x27;m Chain.</text><rect x="214" y="19" width="3" height="28" rx="0" fill="#95b0ff" class="cursor"/><text x="21" y="72" font-size="17" fill="#a3b0b7" font-weight="400" class="" >Computer science student.</text><circle cx="24" cy="103" r="3" fill="#95b0ff" class="pulse"/><text x="35" y="108" font-size="15" fill="#a3b0b7" font-weight="400" class="" >C++ coursework · Python · self-learning</text>
</svg>
