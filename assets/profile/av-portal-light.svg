<svg xmlns="http://www.w3.org/2000/svg" width="480" height="282" viewBox="0 0 480 282" role="img" aria-labelledby="title desc">
<title id="title">AV Operations Portal: independent sample application</title><desc id="desc">Inventory and role-based workflows with JSON command preview and an audit log. Commands are simulated. Open the repository and screenshots.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:5 8;animation:flow 2.4s linear infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.delayed{animation-delay:1.8s}
.cursor{animation:cursor 1.2s steps(1) infinite}
.page{animation:page 5s ease-in-out infinite}
.route{animation:route 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes page{0%,100%{transform:translateY(0)}45%,65%{transform:translateY(-5px)}}
@keyframes route{0%,100%{stroke-dashoffset:24}50%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.cursor,.page,.route{animation:none}}
</style>
<rect x="1" y="1" width="478" height="280" rx="14" fill="#f7f6f2" stroke="#d8dbd1" class=""/><text x="24" y="29" font-size="10" fill="#62675e" font-weight="500" class="mono" letter-spacing="1">03 / APPLICATION WORKFLOWS</text><text x="24" y="65" font-size="27" fill="#20231f" font-weight="650" class="" letter-spacing="-.7">AV Operations Portal</text><path d="M439 25H453V39M453 25L438 40" fill="none" stroke="#b84b29" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="" /><path d="M24 245H456" fill="none" stroke="#d8dbd1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="" /><text x="24" y="93" font-size="17" fill="#62675e" font-weight="400" class="" >Inventory. Roles. A clear next action.</text><rect x="24" y="115" width="432" height="77" rx="8" fill="#eeede7" class=""/><rect x="43" y="135" width="104" height="36" rx="6" fill="#f7f6f2" stroke="#d8dbd1" class=""/><text x="95" y="158" font-size="10" fill="#20231f" font-weight="500" class="mono" text-anchor="middle">INVENTORY</text><rect x="188" y="135" width="104" height="36" rx="6" fill="#f7f6f2" stroke="#d8dbd1" class=""/><text x="240" y="158" font-size="10" fill="#20231f" font-weight="500" class="mono" text-anchor="middle">JSON</text><rect x="332" y="135" width="104" height="36" rx="6" fill="#f7f6f2" stroke="#d8dbd1" class=""/><text x="384" y="158" font-size="10" fill="#20231f" font-weight="500" class="mono" text-anchor="middle">AUDIT LOG</text><path d="M149 153H186M294 153H330" fill="none" stroke="#b84b29" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="flow" /><circle cx="285" cy="135" r="4" fill="#b84b29" class="pulse"/><text x="24" y="219" font-size="13" fill="#20231f" font-weight="400" class="" >Manager / technician views · simulated commands</text><text x="24" y="267" font-size="12" fill="#b84b29" font-weight="500" class="" >Python · Streamlit · Pandas · JSON</text>
</svg>
