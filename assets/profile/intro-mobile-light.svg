<svg xmlns="http://www.w3.org/2000/svg" width="480" height="288" viewBox="0 0 480 288" role="img" aria-labelledby="title desc">
<title id="title">Hi, I&#x27;m Chain — computer science student</title><desc id="desc">C++ in class, Python in projects, self-directed learning. I enjoy tools and hands-on hardware.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:5 8;animation:flow 2.4s linear infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.delayed{animation-delay:1.8s}
.cursor{animation:cursor 1.2s steps(1) infinite}
.page{animation:page 5s ease-in-out infinite}
.route{animation:route 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes page{0%,100%{transform:translateY(0)}45%,65%{transform:translateY(-5px)}}
@keyframes route{0%,100%{stroke-dashoffset:24}50%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.cursor,.page,.route{animation:none}}
</style>
<rect x="1" y="1" width="478" height="286" rx="14" fill="#f7f6f2" stroke="#d8dbd1" class=""/><text x="24" y="31" font-size="10" fill="#62675e" font-weight="500" class="mono" letter-spacing=".8">CHAIN567 / A WORK IN PROGRESS</text><text x="22" y="90" font-size="48" fill="#20231f" font-weight="700" class="" letter-spacing="-1.5">Hi, I&#x27;m Chain.</text><rect x="298" y="55" width="3" height="36" rx="0" fill="#2856d8" class="cursor"/><text x="24" y="124" font-size="18" fill="#20231f" font-weight="400" class="" >Computer science student.</text><text x="24" y="151" font-size="17" fill="#62675e" font-weight="400" class="" >Tools, hardware, and a lot of curiosity.</text><rect x="24" y="177" width="138" height="62" rx="7" fill="#eeede7" class=""/><circle cx="35" cy="193" r="3" fill="#2856d8" class="pulse"/><text x="45" y="197" font-size="9" fill="#62675e" font-weight="400" class="mono" >IN CLASS</text><text x="34" y="224" font-size="17" fill="#20231f" font-weight="600" class="" >C++</text><rect x="170" y="177" width="138" height="62" rx="7" fill="#eeede7" class=""/><circle cx="181" cy="193" r="3" fill="#326844" class="pulse delayed"/><text x="191" y="197" font-size="9" fill="#62675e" font-weight="400" class="mono" >IN PROJECTS</text><text x="180" y="224" font-size="17" fill="#20231f" font-weight="600" class="" >Python</text><rect x="316" y="177" width="138" height="62" rx="7" fill="#eeede7" class=""/><circle cx="327" cy="193" r="3" fill="#b84b29" class="pulse"/><text x="337" y="197" font-size="9" fill="#62675e" font-weight="400" class="mono" >AFTER CLASS</text><text x="326" y="224" font-size="17" fill="#20231f" font-weight="600" class="" >Self-learning</text><text x="24" y="267" font-size="10" fill="#62675e" font-weight="400" class="mono" letter-spacing=".5">SOFTWARE + HARDWARE / PRACTICAL TOOLS</text>
</svg>
