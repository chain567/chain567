<svg xmlns="http://www.w3.org/2000/svg" width="960" height="112" viewBox="0 0 960 112" role="img" aria-labelledby="title desc">
<title id="title">Hi, I&#x27;m Chain — computer science student</title><desc id="desc">C++ coursework, Python projects and self-directed learning. Tools, hardware and curiosity.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:5 8;animation:flow 2.4s linear infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.delayed{animation-delay:1.8s}
.cursor{animation:cursor 1.2s steps(1) infinite}
.page{animation:page 5s ease-in-out infinite}
.route{animation:route 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes page{0%,100%{transform:translateY(0)}45%,65%{transform:translateY(-5px)}}
@keyframes route{0%,100%{stroke-dashoffset:24}50%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.cursor,.page,.route{animation:none}}
</style>
<rect x="1" y="1" width="958" height="110" rx="12" fill="#171b20" stroke="#38434a" class=""/><text x="24" y="47" font-size="35" fill="#eff1e9" font-weight="700" class="" letter-spacing="-1">Hi, I&#x27;m Chain.</text><rect x="224" y="22" width="3" height="29" rx="0" fill="#95b0ff" class="cursor"/><text x="25" y="80" font-size="17" fill="#a3b0b7" font-weight="400" class="" >Computer science student. Tools, hardware, and curiosity.</text><path d="M530 22V90" fill="none" stroke="#38434a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="" /><circle cx="553" cy="39" r="3" fill="#95b0ff" class="pulse"/><text x="563" y="43" font-size="10" fill="#a3b0b7" font-weight="400" class="mono" >IN CLASS</text><text x="553" y="74" font-size="17" fill="#eff1e9" font-weight="600" class="" >C++</text><circle cx="682" cy="39" r="3" fill="#a3d9ac" class="pulse"/><text x="692" y="43" font-size="10" fill="#a3b0b7" font-weight="400" class="mono" >IN PROJECTS</text><text x="682" y="74" font-size="17" fill="#eff1e9" font-weight="600" class="" >Python</text><circle cx="813" cy="39" r="3" fill="#ffab86" class="pulse"/><text x="823" y="43" font-size="10" fill="#a3b0b7" font-weight="400" class="mono" >AFTER CLASS</text><text x="813" y="74" font-size="17" fill="#eff1e9" font-weight="600" class="" >Self-learning</text>
