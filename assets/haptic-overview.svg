<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">Haptic Navigation — location to physical feedback</title>
<desc id="desc">System illustration of Android route data, proximity logic, Bluetooth SPP, and an Arduino haptic prototype. Not a hardware photograph or application screenshot.</desc>
