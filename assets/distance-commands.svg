<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc">
<title id="title">VibeGuide distance, turn direction, and motor commands</title>
<desc id="desc">Normal approach: over 100 metres means off, 50 to 100 metres means low on the turn side, and over 10 to 50 metres means high on the turn side. First entering 60 metres triggers warning command 3 on both sides. At 10 metres or less, an intermediate waypoint requests 3 on both sides, while the destination requests 2 then stop. Distances are schematic.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#163044"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#e6f1f8"/></marker>
</defs>
<rect width="1280" height="750" rx="20" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="64" y="52" fill="#7ce8db" font-size="16" letter-spacing="3">VIBEGUIDE / COMMAND GUIDE</text>
<text x="62" y="106" fill="#f3f8fc" font-size="40" font-weight="700">Distance → direction → vibration</text>
<text x="64" y="136" fill="#b8cbd9" font-size="18">Normal approach commands go to the turn side; the other side receives 0.</text>
<g stroke-width="1.5">
<rect x="64" y="160" width="286" height="130" rx="14" fill="#152b43" stroke="#6ea8e8"/>
<rect x="374" y="160" width="286" height="130" rx="14" fill="#133d42" stroke="#71dfd4"/>
<rect x="684" y="160" width="286" height="130" rx="14" fill="#403a2a" stroke="#ffc76b"/>
<rect x="994" y="160" width="222" height="130" rx="14" fill="#322c4b" stroke="#baa4ef"/>
</g>
<g font-size="20" font-weight="600">
<text x="86" y="195" fill="#a9d1ff">d &gt; 100 m</text>
<text x="396" y="195" fill="#7ce8db">50 m &lt; d ≤ 100 m</text>
<text x="706" y="195" fill="#ffd68f">10 m &lt; d ≤ 50 m</text>
<text x="1016" y="195" fill="#d0befa">d ≤ 10 m</text>
</g>
<g font-size="34" font-weight="700" fill="#f3f8fc">
<text x="86" y="241">Command 0</text><text x="396" y="241">Command 1</text><text x="706" y="241">Command 2</text><text x="1016" y="241" font-size="30">Waypoint</text>
</g>
<g font-size="17" fill="#c5d6e3"><text x="86" y="269">Off</text><text x="396" y="269">Low PWM · turn side</text><text x="706" y="269">High PWM · turn side</text><text x="1016" y="269">Event commands below</text></g>
<text x="64" y="328" font-size="16" fill="#b8cbd9">MOVING TOWARD THE WAYPOINT</text>
<path d="M387 322H1200" stroke="#e6f1f8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M64 361H374" stroke="#6ea8e8" stroke-width="14"/>
<path d="M374 361H684" stroke="#71dfd4" stroke-width="14"/>
<path d="M684 361H994" stroke="#ffc76b" stroke-width="14"/>
<path d="M994 361H1216" stroke="#baa4ef" stroke-width="14"/>
<g stroke="#e6f1f8" stroke-width="2"><path d="M374 346V379"/><path d="M684 346V379"/><path d="M994 346V379"/></g>
<circle cx="1216" cy="361" r="12" fill="#e6f1f8"/>
<g font-size="18" fill="#d8e6f0" text-anchor="middle"><text x="374" y="406">100 m</text><text x="684" y="406">50 m</text><text x="994" y="406">10 m</text><text x="1216" y="406">0 m</text></g>
<g fill="#162c40" stroke="#365363"><rect x="64" y="435" width="548" height="75" rx="12"/><rect x="636" y="435" width="580" height="75" rx="12"/></g>
<text x="84" y="464" fill="#7ce8db" font-size="16">LEFT TURN</text><text x="656" y="464" fill="#ffc76b" font-size="16">RIGHT TURN</text>
<text x="84" y="494" fill="#f3f8fc" font-size="23">Left: 1 or 2    /    Right: 0</text><text x="656" y="494" fill="#f3f8fc" font-size="23">Left: 0    /    Right: 1 or 2</text>
<text x="64" y="548" fill="#d0befa" font-size="16" letter-spacing="1">EVENT OVERRIDES · BOTH SIDES</text>
<g fill="#242d45" stroke="#6d6289"><rect x="64" y="567" width="368" height="116" rx="12"/><rect x="456" y="567" width="368" height="116" rx="12"/><rect x="848" y="567" width="368" height="116" rx="12"/></g>
<g fill="#d0befa" font-size="16"><text x="84" y="595">FIRST ENTERING d ≤ 60 m</text><text x="476" y="595">WAYPOINT: d ≤ 10 m</text><text x="868" y="595">DESTINATION: d ≤ 10 m</text></g>
<g fill="#f3f8fc" font-size="27" font-weight="600"><text x="84" y="633">L: 3  /  R: 3</text><text x="476" y="633">L: 3  /  R: 3</text><text x="868" y="633">Both: 2 → 0</text></g>
<g fill="#c5d6e3" font-size="17"><text x="84" y="663">Warning pulse overrides intensity</text><text x="476" y="663">Then advance to the next step</text><text x="868" y="663">Arrival cue, then stop request</text></g>
<text x="64" y="721" fill="#b8cbd9" font-size="16">Firmware: 0 off · 1 low PWM · 2 high PWM · 3 two brief pulses</text>
<text x="1216" y="721" text-anchor="end" fill="#8ea8bc" font-size="15">SCHEMATIC / NOT TO SCALE</text>
</g></svg>
