<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
<title id="title">Distance to waypoint and Bluetooth commands</title>
<desc id="desc">Approaching a waypoint: above 100 metres sends 0; above 50 through 100 sends 1; 10 through 50 sends 2; below 10 advances an intermediate waypoint, or requests 2 and disconnects at the destination. Distances are schematic, not to scale.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#163044"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#e6f1f8"/></marker>
</defs>
<rect width="1280" height="570" rx="20" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="64" y="52" fill="#7ce8db" font-size="16" letter-spacing="3">HAPTIC NAVIGATION / COMMAND GUIDE</text>
<text x="62" y="106" fill="#f3f8fc" font-size="38" font-weight="700">Getting closer to the next waypoint</text>
<g stroke-width="1.5">
<rect x="64" y="143" width="286" height="130" rx="14" fill="#152b43" stroke="#6ea8e8"/>
<rect x="374" y="143" width="286" height="130" rx="14" fill="#133d42" stroke="#71dfd4"/>
<rect x="684" y="143" width="286" height="130" rx="14" fill="#403a2a" stroke="#ffc76b"/>
<rect x="994" y="143" width="222" height="130" rx="14" fill="#322c4b" stroke="#baa4ef"/>
</g>
<g font-size="20" font-weight="600">
<text x="86" y="178" fill="#a9d1ff">d &gt; 100 m</text>
<text x="396" y="178" fill="#7ce8db">50 m &lt; d ≤ 100 m</text>
<text x="706" y="178" fill="#ffd68f">10 m ≤ d ≤ 50 m</text>
<text x="1016" y="178" fill="#d0befa">d &lt; 10 m</text>
</g>
<g font-size="34" font-weight="700" fill="#f3f8fc">
<text x="86" y="224">Command 0</text><text x="396" y="224">Command 1</text><text x="706" y="224">Command 2</text><text x="1016" y="224" font-size="30">Waypoint</text>
</g>
<g font-size="17" fill="#c5d6e3"><text x="86" y="252">Stop cue</text><text x="396" y="252">Approach band</text><text x="706" y="252">Near band</text><text x="1016" y="252">Advance or finish</text></g>
<text x="64" y="311" font-size="16" fill="#b8cbd9">MOVING TOWARD THE WAYPOINT</text>
<path d="M387 305H1200" stroke="#e6f1f8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M64 344H374" stroke="#6ea8e8" stroke-width="14"/>
<path d="M374 344H684" stroke="#71dfd4" stroke-width="14"/>
<path d="M684 344H994" stroke="#ffc76b" stroke-width="14"/>
<path d="M994 344H1216" stroke="#baa4ef" stroke-width="14"/>
<g stroke="#e6f1f8" stroke-width="2"><path d="M374 329V362"/><path d="M684 329V362"/><path d="M994 329V362"/></g>
<circle cx="1216" cy="344" r="12" fill="#e6f1f8"/>
<g font-size="18" fill="#d8e6f0" text-anchor="middle"><text x="374" y="389">100 m</text><text x="684" y="389">50 m</text><text x="994" y="389">10 m</text><text x="1216" y="389">0 m</text></g>
<g fill="#162c40" stroke="#365363"><rect x="64" y="420" width="548" height="80" rx="12"/><rect x="636" y="420" width="580" height="80" rx="12"/></g>
<g fill="#d0befa" font-size="15" letter-spacing="1"><text x="84" y="447">UNDER 10 m / INTERMEDIATE WAYPOINT</text><text x="656" y="447">UNDER 10 m / FINAL DESTINATION</text></g>
<g fill="#f3f8fc" font-size="22"><text x="84" y="479">Advance to the next route step</text><text x="656" y="479">Request command 2, then disconnect</text></g>
<text x="64" y="539" font-size="16" fill="#b8cbd9">Single ASCII bytes · Consecutive duplicate commands are suppressed</text>
<text x="1216" y="539" text-anchor="end" font-size="15" fill="#8ea8bc">SCHEMATIC / NOT TO SCALE</text>
</g></svg>
